# Prometheus endpoint with the opt-in ServiceMonitor, carrying the labels,
# timings, and relabeling a Prometheus Operator installation would configure.
image:
  tag: ci-test
polytomic:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
      interval: 30s
      scrapeTimeout: 5s
      relabelings:
        - targetLabel: cluster
          replacement: ci
      metricRelabelings:
        - action: labeldrop
          regex: organization_id
